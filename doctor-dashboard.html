<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MedAI Doctor Portal</title>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if(token){
    localStorage.setItem('medai_token', token);
    params.delete('token');
    const cleanUrl = `${window.location.pathname}${params.toString() ? `?${params.toString()}` : ''}${window.location.hash}`;
    window.history.replaceState({}, document.title, cleanUrl);
  }
  if(!localStorage.getItem('medai_token')){
    window.location.replace('doctor-login.html');
  }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030b14;--surface:#0a1828;--surface2:#0e2038;--surface3:#122540;
  --border:rgba(0,212,255,0.08);--border2:rgba(0,212,255,0.16);
  --accent:#00d4ff;--accent2:#0066cc;--safe:#00ff88;
  --danger:#ff4d6d;--warning:#ffaa33;--blue:#00d4ff;
  --text:#ddeeff;--muted:rgba(150,200,230,0.45);
  --sidebar-w:260px;--panel-w:340px;--head:'Syne',sans-serif;
  --mono:'Share Tech Mono',monospace;--body:'DM Sans',sans-serif;
  --radius:16px;
}
html,body{height:100%;font-family:var(--body);background:var(--bg);color:var(--text);overflow:hidden}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);background-size:40px 40px}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;top:-200px;right:-200px;background:radial-gradient(circle,rgba(0,180,255,0.1),transparent 70%);animation:orb-a 15s ease-in-out infinite}
.orb-2{width:500px;height:500px;bottom:-150px;left:-100px;background:radial-gradient(circle,rgba(0,255,136,0.07),transparent 70%);animation:orb-b 20s ease-in-out infinite}
@keyframes orb-a{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,50px)}}
@keyframes orb-b{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}

#shell{position:relative;z-index:1;display:flex;height:100vh}

/* SIDEBAR: patient list */
.dp-sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:rgba(6,15,28,0.85);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(24px);position:relative}
.dp-sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent)}
.dp-logo{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:64px}
.dp-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0044cc);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 20px rgba(0,212,255,0.3);animation:logo-pulse 3s ease-in-out infinite}
@keyframes logo-pulse{0%,100%{box-shadow:0 0 20px rgba(0,212,255,0.3)}50%{box-shadow:0 0 35px rgba(0,212,255,0.5)}}
.dp-logo-text{font-family:var(--head);font-size:16px;font-weight:800}.dp-logo-text span{color:var(--accent)}
.dp-search{padding:12px 14px;border-bottom:1px solid var(--border)}
.dp-search-bar{display:flex;align-items:center;gap:8px;background:rgba(0,212,255,0.04);border:1px solid var(--border2);border-radius:8px;padding:8px 12px}
.dp-search-input{background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:11px;width:100%}
.dp-search-input::placeholder{color:var(--muted)}
.dp-list{flex:1;overflow-y:auto;padding:6px 0}
.dp-list::-webkit-scrollbar{width:3px}
.dp-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.dp-empty{padding:2rem 1.25rem;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px}
.pt-item{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .2s;position:relative}
.pt-item:hover{background:rgba(0,212,255,0.06);border-left-color:rgba(0,212,255,0.3)}
.pt-item.active{background:rgba(0,212,255,0.1);border-left-color:var(--accent)}
.pt-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--surface2),var(--surface3));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}
.pt-info{flex:1;min-width:0}
.pt-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pt-sev{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sev-EMERGENCY{background:var(--danger);box-shadow:0 0 8px rgba(255,77,109,0.6)}
.sev-HIGH{background:var(--warning)}
.sev-MEDIUM{background:var(--blue)}
.sev-LOW{background:var(--safe)}
.dp-bottom{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.dp-doc-name{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-logout{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--danger);background:rgba(255,77,109,0.08);border:1px solid rgba(255,77,109,0.2);border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .2s;flex-shrink:0}
.dp-logout:hover{background:rgba(255,77,109,0.2)}

/* MAIN CHAT COLUMN */
.dp-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dp-topbar{height:58px;flex-shrink:0;background:rgba(6,15,28,0.8);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;backdrop-filter:blur(16px)}
.dp-topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.dp-topbar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--surface2),var(--surface3));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}
.dp-topbar-name{font-family:var(--head);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-topbar-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}
.profile-toggle-btn{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border:1px solid var(--border2);background:rgba(0,212,255,0.08);color:var(--accent);border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;flex-shrink:0}
.profile-toggle-btn:hover{background:rgba(0,212,255,0.18);border-color:var(--accent)}
.profile-toggle-btn.open{background:var(--accent);color:#001a2e}

.dp-chat-area{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:10px}
.dp-chat-area::-webkit-scrollbar{width:3px}
.dp-chat-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.msg-row{display:flex;max-width:70%}
.msg-row.me{align-self:flex-end;justify-content:flex-end}
.msg-row.them{align-self:flex-start}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word}
.msg-row.me .msg-bubble{background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.2);border-radius:16px 16px 4px 16px}
.msg-row.them .msg-bubble{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.1);border-radius:16px 16px 16px 4px}
.msg-time{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.msg-row.me .msg-time{text-align:right}

.dp-composer{flex-shrink:0;padding:14px 1.5rem;border-top:1px solid var(--border);display:flex;gap:10px;background:rgba(6,15,28,0.6)}
.dp-composer-input{flex:1;background:rgba(0,212,255,0.04);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--body);font-size:14px;padding:12px 16px;outline:none;resize:none;max-height:120px;transition:border-color .2s}
.dp-composer-input:focus{border-color:var(--accent)}
.dp-send-btn{background:linear-gradient(135deg,rgba(0,212,255,0.9),rgba(0,100,200,0.9));border:1px solid rgba(0,212,255,0.4);border-radius:10px;color:#001a2e;font-family:var(--head);font-weight:700;font-size:13px;padding:0 20px;cursor:pointer;transition:all .2s}
.dp-send-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,0.3)}
.dp-send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

.dp-nochat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted)}
.dp-nochat-icon{font-size:40px;opacity:.4}
.dp-nochat-text{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}

/* COLLAPSIBLE PROFILE PANEL */
.profile-panel{width:0;min-width:0;height:100vh;background:rgba(6,15,28,0.95);border-left:1px solid var(--border);overflow:hidden;flex-shrink:0;transition:width .28s ease,min-width .28s ease;backdrop-filter:blur(24px)}
.profile-panel.open{width:var(--panel-w);min-width:var(--panel-w)}
.profile-panel-inner{width:var(--panel-w);height:100vh;overflow-y:auto;padding:1.25rem}
.profile-panel-inner::-webkit-scrollbar{width:3px}
.profile-panel-inner::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.pp-title{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.pp-title::before{content:'';display:block;width:14px;height:1px;background:var(--accent)}
.pp-close{cursor:pointer;color:var(--muted);font-size:18px;transition:color .2s;line-height:1}
.pp-close:hover{color:var(--accent)}
.pp-name{font-family:var(--head);font-size:20px;font-weight:800;margin-bottom:2px}
.pp-email{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:1.25rem;word-break:break-all}
.pp-section{margin-bottom:1.25rem}
.pp-section-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.pp-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.pp-stat-val{font-family:var(--head);font-size:15px;font-weight:800;color:var(--text)}
.pp-stat-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.chip-row{display:flex;flex-wrap:wrap;gap:4px}
.allergy-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.25);border-radius:20px;padding:3px 10px;font-size:11px;color:#ff8899;font-family:var(--mono)}
.condition-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--blue);font-family:var(--mono)}
.lifestyle-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,170,51,0.08);border:1px solid rgba(255,170,51,0.2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--warning);font-family:var(--mono)}
.pp-empty-note{font-size:12px;color:var(--muted);font-style:italic}
.pp-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.pp-key{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}
.pp-val{color:var(--text);text-align:right;max-width:60%}
.pp-emerg{background:rgba(0,212,255,0.05);border:1px solid var(--border2);border-radius:10px;padding:10px 12px}
.triage-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.triage-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.triage-badge{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid}
.triage-date{font-family:var(--mono);font-size:9px;color:var(--muted)}
.triage-summary{font-size:12px;color:var(--text);line-height:1.4}
.badge-EMERGENCY{color:var(--danger);border-color:rgba(255,77,109,0.3);background:rgba(255,77,109,0.08)}
.badge-HIGH{color:var(--warning);border-color:rgba(255,170,51,0.3);background:rgba(255,170,51,0.08)}
.badge-MEDIUM{color:var(--blue);border-color:rgba(0,212,255,0.3);background:rgba(0,212,255,0.08)}
.badge-LOW{color:var(--safe);border-color:rgba(0,255,136,0.3);background:rgba(0,255,136,0.08)}

@media(max-width:820px){
  :root{--sidebar-w:220px;--panel-w:280px}
  .profile-panel.open{position:fixed;right:0;top:0;z-index:500}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div id="shell">
  <!-- SIDEBAR -->
  <div class="dp-sidebar">
    <div class="dp-logo" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="dp-logo-icon">🩺</div>
        <div class="dp-logo-text">Med<span>AI</span> Doctor</div>
      </div>
      <div style="position:relative">
        <div onclick="toggleNotifications()" style="cursor:pointer;width:34px;height:34px;border-radius:10px;background:rgba(0,212,255,0.08);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative">
          🔔
          <div id="notif-dot" style="display:none;position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface)"></div>
        </div>
        <div id="notif-panel" style="display:none;position:absolute;top:44px;right:0;width:300px;max-height:360px;overflow-y:auto;background:var(--surface);border:1px solid var(--border2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,0.5);z-index:200">
          <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)">
            <span id="notif-head-label">Notifications</span>
            <span onclick="markAllNotificationsRead()" style="cursor:pointer;color:var(--muted);text-transform:none;letter-spacing:0;font-size:10px">Mark all read</span>
          </div>
          <div id="notif-list"></div>
        </div>
      </div>
    </div>
    <div style="padding:10px 14px;border-bottom:1px solid var(--border)">
      <div onclick="openAppointmentsModal()" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(0,212,255,0.06);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--text)">
        <span>📅 Appointment Requests</span>
        <span id="appt-pending-badge" style="display:none;background:var(--danger);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700">0</span>
      </div>
    </div>
    <div class="dp-search">
      <div class="dp-search-bar">
        <span style="font-size:12px">🔍</span>
        <input class="dp-search-input" id="patient-search" placeholder="Search patients..." oninput="filterPatients()"/>
      </div>
    </div>
    <div class="dp-list" id="patient-list">
      <div class="dp-empty">Loading patients...</div>
    </div>
    <div class="dp-bottom">
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
        <span class="dp-doc-name" id="doc-name">—</span>
        <span id="doc-rating" style="font-family:var(--mono);font-size:10px;color:var(--warning)"></span>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase">
          <input type="checkbox" id="availability-toggle" checked onchange="toggleAvailability(this.checked)" style="accent-color:var(--accent)"/>
          Available for new patients
        </label>
      </div>
      <button class="dp-logout" onclick="doctorLogout()">Logout</button>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="dp-main">
    <div id="dp-nochat" class="dp-nochat">
      <div class="dp-nochat-icon">💬</div>
      <div class="dp-nochat-text">Select a patient to start chatting</div>
    </div>

    <div id="dp-chat-shell" style="display:none;flex-direction:column;height:100%">
      <div class="dp-topbar">
        <div class="dp-topbar-left">
          <div class="dp-topbar-avatar" id="chat-avatar">--</div>
          <div>
            <div class="dp-topbar-name" id="chat-name">—</div>
            <div class="dp-topbar-sub" id="chat-sub">—</div>
          </div>
        </div>
        <button class="profile-toggle-btn" id="profile-toggle" onclick="toggleProfilePanel()">
          <span>👤</span> Patient Profile
        </button>
      </div>

      <div class="dp-chat-area" id="chat-area"></div>

      <div id="composer-image-preview" style="display:none;padding:0 1.5rem 10px;align-items:center;gap:10px">
        <img id="composer-image-preview-img" style="max-height:56px;border-radius:8px;border:1px solid var(--border)"/>
        <span style="font-size:12px;color:var(--muted)">Image attached</span>
        <span onclick="clearComposerImage()" style="cursor:pointer;color:var(--muted);font-size:16px;margin-left:auto">✕</span>
      </div>
      <div class="dp-composer">
        <input type="file" accept="image/*" id="composer-image-input" style="display:none" onchange="handleComposerImageSelect(event)"/>
        <button class="dp-send-btn" style="background:var(--surface2);border:1px solid var(--border2);color:var(--text)" onclick="document.getElementById('composer-image-input').click()" title="Attach an image">📎</button>
        <textarea class="dp-composer-input" id="composer-input" placeholder="Type a message..." rows="1" onkeydown="handleComposerKey(event)"></textarea>
        <button class="dp-send-btn" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE PROFILE PANEL -->
  <div class="profile-panel" id="profile-panel">
    <div class="profile-panel-inner">
      <div class="pp-header">
        <div class="pp-title">Patient Profile</div>
        <div class="pp-close" onclick="toggleProfilePanel()">✕</div>
      </div>
      <div id="profile-body">
        <div class="pp-empty-note">Loading profile...</div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = localStorage.getItem('medai_api_base_url')
  || (['localhost','127.0.0.1'].includes(window.location.hostname)
        ? 'http://127.0.0.1:5500'
        : 'https://medai-backend-5r9o.onrender.com');

function authHeaders(){
  const token = localStorage.getItem('medai_token');
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

function doctorLogout(){
  localStorage.removeItem('medai_token');
  window.location.href = 'doctor-login.html';
}

let allPatients = [];
let activePatientId = null;
let activeConversationId = null;
let pollTimer = null;
let profilePollTimer = null;

function initials(name){
  return (name || '?').split(' ').filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('') || '?';
}

function timeAgo(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  const diffMs = Date.now() - d.getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'now';
  if(mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return `${hrs}h`;
  return `${Math.floor(hrs / 24)}d`;
}

// ---------- doctor's own profile ----------
async function loadDoctorMe(){
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/me`, { headers: authHeaders() });
    if(res.status === 401){ doctorLogout(); return; }
    const data = await res.json();
    if(data.profile){
      document.getElementById('doc-name').textContent = 'Dr. ' + data.profile.fullName;
      document.getElementById('availability-toggle').checked = data.profile.isAvailable !== false;
      loadDoctorOwnRating(data.profile.userId);
    }
  }catch(e){ console.error('Failed to load doctor profile', e); }
}

async function loadDoctorOwnRating(doctorId){

async function toggleAvailability(isAvailable){

    await fetch(`${API_BASE_URL}/api/doctor-portal/me/availability`, {

// ---------- patient list ----------
async function loadPatients(){
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/patients`, { headers: authHeaders() });
    if(res.status === 401){ doctorLogout(); return; }
    const data = await res.json();
    allPatients = data.patients || [];
    renderPatientList(allPatients);
  }catch(e){
    document.getElementById('patient-list').innerHTML = '<div class="dp-empty">Couldn\'t load patients. Retry shortly.</div>';
  }
}

function renderPatientList(patients){
  const list = document.getElementById('patient-list');
  if(!patients.length){
    list.innerHTML = '<div class="dp-empty">No patients yet.</div>';
    return;
  }
  list.innerHTML = patients.map(p => `
    <div class="pt-item ${p.id === activePatientId ? 'active' : ''}" onclick="selectPatient('${p.id}')">
      <div class="pt-avatar">${initials(p.name)}</div>
      <div class="pt-info">
        <div class="pt-name">${p.name}</div>
        <div class="pt-preview">${p.lastMessage ? p.lastMessage.slice(0,40) : (p.lastTriageSummary ? p.lastTriageSummary.slice(0,40) : 'No messages yet')}</div>
      </div>
      ${p.highestSeverity ? `<div class="pt-sev sev-${p.highestSeverity}" title="${p.highestSeverity}"></div>` : ''}
    </div>
  `).join('');
}

function filterPatients(){
  const q = document.getElementById('patient-search').value.trim().toLowerCase();
  const filtered = allPatients.filter(p =>
    p.name.toLowerCase().includes(q) || (p.email || '').toLowerCase().includes(q)
  );
  renderPatientList(filtered);
}

// ---------- selecting a patient: open/create conversation + load profile ----------
async function selectPatient(patientId){
  activePatientId = patientId;
  renderPatientList(allPatients.filter(p => (document.getElementById('patient-search').value.trim() === '') || true));
  document.getElementById('dp-nochat').style.display = 'none';
  document.getElementById('dp-chat-shell').style.display = 'flex';

  const patient = allPatients.find(p => p.id === patientId);
  document.getElementById('chat-avatar').textContent = initials(patient?.name);
  document.getElementById('chat-name').textContent = patient?.name || 'Patient';
  document.getElementById('chat-sub').textContent = patient?.email || '';

  loadPatientProfile(patientId);
  if(profilePollTimer) clearInterval(profilePollTimer);
  profilePollTimer = setInterval(() => loadPatientProfile(patientId), 10000);

  await openConversation(patientId);
}

async function openConversation(patientId){
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/conversations`, {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ patientId })
    });
    const data = await res.json();
    activeConversationId = data.conversation?.id;
    await loadMessages();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadMessages, 4000);
  }catch(e){ console.error('Failed to open conversation', e); }
}

async function loadMessages(){
  if(!activeConversationId) return;
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/conversations/${activeConversationId}/messages`, { headers: authHeaders() });
    const data = await res.json();
    renderMessages(data.messages || []);
  }catch(e){ console.error('Failed to load messages', e); }
}

function renderMessages(messages){
  const area = document.getElementById('chat-area');
  const wasAtBottom = area.scrollTop + area.clientHeight >= area.scrollHeight - 40;
  area.innerHTML = messages.map(m => {
    const imageHtml = m.imageData
      ? `<img src="${m.imageData}" style="max-width:100%;max-height:280px;border-radius:8px;display:block;cursor:pointer;${m.content ? 'margin-bottom:6px' : ''}" onclick="window.open(this.src,'_blank')"/>`
      : '';
    return `
    <div class="msg-row ${m.senderRole === 'DOCTOR' ? 'me' : 'them'}">
      <div>
        <div class="msg-bubble">${imageHtml}${m.content ? escapeHtml(m.content) : ''}</div>
        <div class="msg-time">${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`;
  }).join('');
  if(wasAtBottom || messages.length <= 1) area.scrollTop = area.scrollHeight;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function handleComposerKey(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

let _pendingComposerImage = null;

function handleComposerImageSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('Please choose an image file.');
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1280;
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      _pendingComposerImage = canvas.toDataURL('image/jpeg', 0.75);
      document.getElementById('composer-image-preview-img').src = _pendingComposerImage;
      document.getElementById('composer-image-preview').style.display = 'flex';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function clearComposerImage(){
  _pendingComposerImage = null;
  document.getElementById('composer-image-preview').style.display = 'none';
  document.getElementById('composer-image-preview-img').src = '';
}

async function sendMessage(){
  const input = document.getElementById('composer-input');
  const content = input.value.trim();
  const imageData = _pendingComposerImage;
  if(!content && !imageData) return;
  if(!activeConversationId) return;
  input.value = '';
  clearComposerImage();
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  try{
    await fetch(`${API_BASE_URL}/api/doctor-portal/conversations/${activeConversationId}/messages`, {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ content, imageData })
    });
    await loadMessages();
  }catch(e){ console.error('Failed to send message', e); }
  finally{ btn.disabled = false; }
}

// ---------- patient profile panel ----------
function toggleProfilePanel(){

  const btn = document.getElementById('profile-toggle');

async function loadPatientProfile(patientId){
  const body = document.getElementById('profile-body');
  body.innerHTML = '<div class="pp-empty-note">Loading profile...</div>';
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/patients/${patientId}`, { headers: authHeaders() });
    const data = await res.json();
    renderProfile(data.patient, data.triageHistory || [], data.vitalReadings || []);
  }catch(e){
    body.innerHTML = '<div class="pp-empty-note">Couldn\'t load this patient\'s profile.</div>';
  }

function timeAgoShort(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function renderProfile(patient, triageHistory, vitalReadings){

  if(patient.smokes) lifestyleChips.push('Smokes');
  if(patient.alcohol) lifestyleChips.push('Drinks alcohol');
  if(patient.exercises) lifestyleChips.push('Exercises regularly');

  body.innerHTML = `
    <div class="pp-name">${name}</div>
    <div class="pp-email">${patient.email}</div>

    <div class="pp-section">
      <div class="pp-section-label">Live Vitals ${latestVital ? `<span style="color:var(--muted);text-transform:none;letter-spacing:0">· ${timeAgoShort(latestVital.createdAt)} (${latestVital.source})</span>` : ''}</div>
      ${latestVital ? `
        <div class="pp-stat-grid">
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.heartRate || '—'}</div><div class="pp-stat-label">Heart Rate (bpm)</div></div>
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.spo2 || '—'}</div><div class="pp-stat-label">SpO2 (%)</div></div>
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.temp || '—'}</div><div class="pp-stat-label">Temp (°C)</div></div>
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.bp || '—'}</div><div class="pp-stat-label">Blood Pressure</div></div>
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.glucose || '—'}</div><div class="pp-stat-label">Glucose</div></div>
          <div class="pp-stat"><div class="pp-stat-val">${latestVital.weight || '—'}</div><div class="pp-stat-label">Weight</div></div>
        </div>
        ${vitalReadings.length > 1 ? `
          <div style="margin-top:10px">
            ${vitalReadings.slice(1, 6).map(v => `
              <div class="pp-row">
                <span class="pp-key">${timeAgoShort(v.createdAt)} · ${v.source}</span>
                <span class="pp-val">${[v.heartRate && v.heartRate + ' bpm', v.bp, v.temp && v.temp + '°C', v.spo2 && v.spo2 + '% SpO2'].filter(Boolean).join(' · ') || '—'}</span>
              </div>
            `).join('')}
          </div>` : ''}
      ` : '<div class="pp-empty-note">No vitals logged yet</div>'}
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Basic Info</div>
      <div class="pp-stat-grid">
        <div class="pp-stat"><div class="pp-stat-val">${age !== null ? age : '—'}</div><div class="pp-stat-label">Age</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${patient.gender || '—'}</div><div class="pp-stat-label">Gender</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${patient.height || '—'}</div><div class="pp-stat-label">Height</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${patient.weight || '—'}</div><div class="pp-stat-label">Weight</div></div>
      </div>
      <div class="pp-stat" style="margin-top:8px">
        <div class="pp-stat-val">${patient.bloodGroup || '—'}</div>
        <div class="pp-stat-label">Blood Group</div>
      </div>
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Conditions</div>
      ${patient.conditions && patient.conditions.length
        ? `<div class="chip-row">${patient.conditions.map(c => `<span class="condition-chip">${escapeHtml(c)}</span>`).join('')}</div>`
        : '<div class="pp-empty-note">None reported</div>'}
      ${patient.otherConditions ? `<div class="pp-row" style="margin-top:8px"><span class="pp-val" style="text-align:left;max-width:100%">${escapeHtml(patient.otherConditions)}</span></div>` : ''}
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Allergies</div>
      ${patient.allergies && patient.allergies.length
        ? `<div class="chip-row">${patient.allergies.map(a => `<span class="allergy-chip">${escapeHtml(a)}</span>`).join('')}</div>`
        : '<div class="pp-empty-note">None reported</div>'}
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Medications</div>
      <div class="pp-empty-note" style="color:var(--text);font-style:normal">${patient.medications ? escapeHtml(patient.medications) : 'None reported'}</div>
    </div>

    <div class="pp-section">
      <div class="pp-section-label">Lifestyle</div>
      ${lifestyleChips.length
        ? `<div class="chip-row">${lifestyleChips.map(c => `<span class="lifestyle-chip">${c}</span>`).join('')}</div>`
        : '<div class="pp-empty-note">Not reported</div>'}

      </div>

    <div class="pp-section">
      <div class="pp-section-label">Recent Triage History</div>
      ${triageHistory.length
        ? triageHistory.map(t => `
          <div class="triage-item">

              <span class="triage-badge badge-${t.triageLevel}">${t.triageLevel}</span>

          </div>
        `).join('')
        : '<div class="pp-empty-note">No triage records yet</div>'}

  `;

function calcAge(dob){
  const birth = new Date(dob);
  if(isNaN(birth.getTime())) return null;
  const diff = Date.now() - birth.getTime();
  return Math.floor(diff / (365.25 * 24 * 60 * 60 * 1000));
}

// ---------- init ----------
// ---------- Appointment Requests ----------
let _doctorAppointments = [];

async function pollDoctorAppointments(){
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/appointments`, { headers: authHeaders() });
    if(!res.ok) return;
    const data = await res.json();
    _doctorAppointments = data.appointments || [];
    const pendingCount = _doctorAppointments.filter(a => a.status === 'PENDING').length;
    const badge = document.getElementById('appt-pending-badge');
    if(badge){
      badge.textContent = pendingCount;
      badge.style.display = pendingCount ? 'inline-block' : 'none';
    }
    const modal = document.getElementById('appointments-modal');
    if(modal) renderAppointmentsList();
  }catch(e){ /* non-critical, retry next interval */ }
}
setInterval(pollDoctorAppointments, 15000);

function openAppointmentsModal(){
  const existing = document.getElementById('appointments-modal');
  if(existing){ existing.remove(); return; }

  const modal = document.createElement('div');
  modal.id = 'appointments-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem';
  modal.innerHTML = `
    <div style="max-width:480px;width:100%;max-height:80vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1.5rem" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div style="font-family:var(--head);font-weight:700;font-size:16px">Appointment Requests</div>
        <span onclick="document.getElementById('appointments-modal').remove()" style="cursor:pointer;color:var(--muted);font-size:18px">✕</span>
      </div>
      <div id="appointments-list-body"></div>
    </div>`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
  renderAppointmentsList();
}

function renderAppointmentsList(){
  const body = document.getElementById('appointments-list-body');
  if(!body) return;

  if(!_doctorAppointments.length){
    body.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:1.5rem 0">No appointment requests yet.</div>';
    return;
  }

  const statusColor = { PENDING: 'var(--warning)', ACCEPTED: 'var(--safe)', DECLINED: 'var(--danger)', CANCELLED: 'var(--muted)' };

  body.innerHTML = _doctorAppointments.map(a => `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <div style="font-weight:700;font-size:13px">${escapeHtml(a.patientName)}</div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px">${escapeHtml(a.scheduledDate)} · ${escapeHtml(a.scheduledTime)} · ${escapeHtml(a.urgency)}</div>
        </div>
        <span style="font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:${statusColor[a.status] || 'var(--muted)'}">${a.status}</span>
      </div>
      ${a.reason ? `<div style="font-size:12px;color:var(--text);margin-top:8px">${escapeHtml(a.reason)}</div>` : ''}
      ${a.status === 'PENDING' ? `
        <div style="display:flex;gap:8px;margin-top:10px">
          <button onclick="respondToAppointment('${a.id}','ACCEPTED')" style="flex:1;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:var(--safe);border-radius:8px;padding:7px;font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer">ACCEPT</button>
          <button onclick="respondToAppointment('${a.id}','DECLINED')" style="flex:1;background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);color:var(--danger);border-radius:8px;padding:7px;font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer">DECLINE</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function respondToAppointment(id, status){
  let declineReason = null;
  if(status === 'DECLINED'){
    declineReason = prompt('Optional: let the patient know why (e.g. "Not available at that time")') || null;
  }
  try{
    const res = await fetch(`${API_BASE_URL}/api/doctor-portal/appointments/${id}`, {
      method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ status, declineReason })
    });
    if(!res.ok) throw new Error('failed');
    await pollDoctorAppointments();
  }catch(e){
    alert('Could not update this appointment. Please try again.');
  }
}

// ---------- Notifications ----------
let _latestNotifications = [];

function toggleNotifications(){
  const panel = document.getElementById('notif-panel');
  if(!panel) return;
  const isOpen = panel.style.display === 'block';
  panel.style.display = isOpen ? 'none' : 'block';
  if(!isOpen) fetchAndRenderNotifications();
}

document.addEventListener('click', (e) => {
  const panel = document.getElementById('notif-panel');
  if(!panel || panel.style.display !== 'block') return;
  if(!panel.contains(e.target) && !e.target.closest('[onclick="toggleNotifications()"]')){
    panel.style.display = 'none';
  }
});

function notificationIcon(type){
  return {
    message: '💬', appointment_request: '📅', appointment_accepted: '✅',
    appointment_declined: '❌', review_received: '⭐', doctor_approved: '🎉',
    doctor_rejected: 'ℹ️', payment_success: '👑'
  }[type] || '🔔';
}

async function fetchAndRenderNotifications(){
  try{
    const res = await fetch(`${API_BASE_URL}/api/notifications`, { headers: authHeaders() });
    if(!res.ok) return;
    const data = await res.json();
    _latestNotifications = data.notifications || [];
    renderNotifications(data.unreadCount || 0);
  }catch(e){ /* non-critical, retry next interval */ }
}

function renderNotifications(unreadCount){
  const list = document.getElementById('notif-list');
  const dot = document.getElementById('notif-dot');
  const head = document.getElementById('notif-head-label');
  if(!list) return;

  if(head) head.textContent = unreadCount > 0 ? `Notifications (${unreadCount} new)` : 'Notifications';
  if(dot) dot.style.display = unreadCount > 0 ? 'block' : 'none';

  if(!_latestNotifications.length){
    list.innerHTML = '<div style="padding:1rem;color:var(--muted);font-size:12px;text-align:center">No notifications yet.</div>';
    return;
  }

  list.innerHTML = _latestNotifications.map(n => `
    <div onclick="handleNotificationClick('${n.id}', ${JSON.stringify(n.link || '')})" style="padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px;line-height:1.5;${n.isRead ? '' : 'background:rgba(0,212,255,0.06)'}">
      <div>${notificationIcon(n.type)} <strong>${escapeHtml(n.title)}</strong></div>
      <div style="color:var(--muted);margin-top:2px">${escapeHtml(n.body)}</div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px">${timeAgoShort(n.createdAt)}</div>
    </div>
  `).join('');
}

async function handleNotificationClick(id, link){
  fetch(`${API_BASE_URL}/api/notifications/${id}/read`, {
    method: 'PATCH', headers: authHeaders()
  }).then(() => fetchAndRenderNotifications()).catch(() => {});

  if(link && link.startsWith('messages:')){
    const conversationId = link.split(':')[1];
    const match = allPatients.find(p => p.conversationId === conversationId);
    if(match) selectPatient(match.id);
  } else if(link === 'appointments'){
    openAppointmentsModal();
  }
  document.getElementById('notif-panel').style.display = 'none';
}

async function markAllNotificationsRead(){
  try{
    await fetch(`${API_BASE_URL}/api/notifications/read-all`, { method: 'PATCH', headers: authHeaders() });
    await fetchAndRenderNotifications();
  }catch(e){ /* non-critical */ }
}

setInterval(fetchAndRenderNotifications, 20000);
fetchAndRenderNotifications();

loadDoctorMe();
loadPatients();
pollDoctorAppointments();
</script>
